# HF_TOKEN: "hf_xxxxxxxxxxxxxxxxxxxx"
# This config file is for extracting activations from LLaMA-3.1-8B for the functional-group dataset.
# Put your HuggingFace token in the HF_TOKEN line above, then run:
#   python extract_activations.py --config config_extract_activation_fg_8B.yaml

extraction:
  model_name: "meta-llama/Llama-3.1-8B"
  # Alternative model:
  # - "meta-llama/Llama-3.1-8B"
  # - "meta-llama/Llama-2-7b-hf"
  # - "meta-llama/Meta-Llama-3.1-70B"
  batch_size: 16
  aggregation: "last"
  save_dir: "activation_datasets_functional_groups_2"

  quantization:
    # 8B run full fp16, no quantization
    # For 70B, set load_in_4bit: true, bnb_4bit_use_double_quant: true, bnb_4bit_quant_type: "nf4", bnb_4bit_compute_dtype: "float16"
    load_in_4bit: false
    bnb_4bit_use_double_quant: false
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "float16"

  entities:
    - entity_type: "functional_group"
      data_file: "functional_group_dataset_2.csv"
      prompt_name: "10_templates"
      templates:
        - "{iupac_name} ({formula}) contains the functional group "
        - "The primary functional group in {iupac_name} ({formula}) is "
        - "For {iupac_name} ({formula}), the functional-group class is "
        - "{iupac_name} ({formula}) is classified as a molecule containing a "
        - "The characteristic functional group of {iupac_name} ({formula}) is "
        - "The main functional group present in {iupac_name} ({formula}) is "
        - "When classified by functional group, {iupac_name} ({formula}) is a "
        - "{iupac_name} ({formula}) can be categorized by the functional group "
        - "The functional-group identity of {iupac_name} ({formula}) is "
        - "For the molecule {iupac_name} ({formula}), the defining functional group is "

    - entity_type: "functional_group_structure"
      data_file: "functional_group_dataset_2.csv"
      prompt_name: "7_templates"
      templates:
        - "The functional-group structure in {iupac_name} ({formula}) is represented as "
        - "The defining functional-group pattern of {iupac_name} ({formula}) is "
        - "In condensed notation, the functional group in {iupac_name} ({formula}) is "
        - "The characteristic functional-group substructure in {iupac_name} ({formula}) is "
        - "For the molecule {iupac_name} ({formula}), the functional-group structure is "
        - "The structural signature of the functional group in {iupac_name} ({formula}) is "
        - "The functional group of {iupac_name} ({formula}) may be written as "

    - entity_type: "mw"
      data_file: "functional_group_dataset_2.csv"
      prompt_name: "11_templates"
      templates:
